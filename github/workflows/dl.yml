name: dl
on:
  workflow_dispatch:
    inputs:
      id: {required: true}
      q: {required: true}
      fmt: {default: mp3}
      mode: {default: get}
concurrency: {group: dl, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -U yt-dlp
      - name: Download
        env: {ID: "${{ inputs.id }}", Q: "${{ inputs.q }}", FMT: "${{ inputs.fmt }}", MODE: "${{ inputs.mode }}"}
        run: |
          mkdir -p /tmp/out /tmp/dl
          python - <<'PY'
          import os, re, json, glob, shutil, yt_dlp
          ID, Q, FMT, MODE = os.environ['ID'], os.environ['Q'].strip(), os.environ['FMT'], os.environ['MODE']
          OUT = '/tmp/out'
          def fin(**k):
              open(f'{OUT}/{ID}.json', 'w').write(json.dumps(k))
              raise SystemExit(0)
          BAD = re.compile(r'cover|remix|karaoke|reaction|nightcore|slowed|8d|live', re.I)
          GOOD = re.compile(r'official|audio|lyrics|mv', re.I)
          def score(e):
              t = e.get('title') or ''
              s = 2 if GOOD.search(t) else 0
              if BAD.search(t) and not BAD.search(Q): s -= 3
              if 120 <= (e.get('duration') or 0) <= 420: s += 1
              return s
          try:
              if MODE == 'list':
                  isurl = bool(re.match(r'^https?://', Q))
                  with yt_dlp.YoutubeDL({'quiet': True, 'extract_flat': True}) as y:
                      r = y.extract_info(Q if isurl else 'ytsearch8:' + Q, download=False)
                  es = [e for e in (r.get('entries') or [r]) if e]
                  if not isurl: es.sort(key=lambda e: -score(e))
                  fin(list=[{'t': e.get('title') or e.get('id'), 'u': e.get('url') or e.get('webpage_url'), 'd': e.get('duration')} for e in es[:60]])
              url = Q
              if not re.match(r'^https?://', Q):
                  with yt_dlp.YoutubeDL({'quiet': True, 'extract_flat': True}) as y:
                      r = y.extract_info('ytsearch8:' + Q, download=False)
                  es = sorted([e for e in (r.get('entries') or []) if e], key=lambda e: -score(e))
                  if not es: fin(error='Khong tim thay ket qua')
                  url = es[0].get('url') or 'https://youtu.be/' + es[0]['id']
              o = {'quiet': True, 'noplaylist': True, 'outtmpl': '/tmp/dl/%(title).80s.%(ext)s',
                   'max_filesize': 95 * 1024 * 1024}
              if FMT in ('mp3', 'flac', 'm4a', 'wav'):
                  pp = {'key': 'FFmpegExtractAudio', 'preferredcodec': FMT}
                  if FMT == 'mp3': pp['preferredquality'] = '320'
                  o.update({'format': 'bestaudio/best', 'postprocessors': [pp]})
              else:
                  h = re.sub(r'\D', '', FMT) or '1080'
                  o.update({'format': f'bv*[height<={h}]+ba/b[height<={h}]/b', 'merge_output_format': 'mp4'})
              with yt_dlp.YoutubeDL(o) as y:
                  y.download([url])
              fs = [f for f in glob.glob('/tmp/dl/*') if not f.endswith(('.part', '.ytdl'))]
              if not fs: fin(error='Khong tai duoc tep (qua 95MB hoac bi chan)')
              ext = fs[0].rsplit('.', 1)[1]
              shutil.move(fs[0], f'{OUT}/{ID}.{ext}')
              fin(file=f'{ID}.{ext}', name=os.path.basename(fs[0]))
          except SystemExit:
              raise
          except Exception as e:
              fin(error=str(e)[:200])
          PY
      - name: Publish
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          mkdir -p /tmp/keep
          git fetch origin data 2>/dev/null && git archive origin/data | tar -x -C /tmp/keep || true
          git checkout -q --orphan data2
          git rm -rfq . ; mkdir downloads
          cp -r /tmp/keep/downloads/. downloads/ 2>/dev/null || true
          cp /tmp/out/* downloads/
          python3 -c "
          import os,time
          for f in os.listdir('downloads'):
              try:
                  if int(f.split('-')[0]) < (time.time()-86400)*1000: os.remove('downloads/'+f)
              except ValueError: pass"
          git add downloads; git commit -qm dl
          git push -f origin data2:data
